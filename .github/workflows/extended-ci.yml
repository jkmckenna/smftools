name: Extended CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

# Both triggers resolve github.ref to refs/heads/main, so cancel-in-progress
# let a manual dispatch kill the weekly scheduled integration run. Queue
# instead: these are slow, infrequent, and losing one costs a week of coverage.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  minimum-python-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all]"
          python -m pip install --group test
      - name: Run smoke and unit tests
        run: pytest -m "smoke or unit" -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all]"
          python -m pip install --group test
      - name: Run integration tests
        run: pytest -m integration -q
